### Not verified
- I loaded the page in headless Chrome, but only the preloader ("LOADING") rendered in my screenshots; I did **not** visually inspect the post-preloader design or mobile layout. The teardown below is from markup/CSS/JS structure.
- The template's licence is unknown (no LICENSE file). If it is a purchased marketplace template, its code, images and copy cannot simply be reused for a public site without the right licence.

### Assessment (interpretation)
- **Strengths:** a strong typographic hero idea (oversized word + portrait overlap), clear dark/light section rhythm, GSAP-based choreography already structured.
- **Risks/debt:** agency framing (services, testimonials, client logos) does not fit an early-career backend engineer; jQuery + Bootstrap + AOS + GSAP is redundant; no accessibility baseline; unknown licence; OneDrive sync will fight a future `node_modules`.
- **Recommended foundation:** treat this folder as **reference only**; build the real site in a **new Next.js (App Router) + TypeScript + Tailwind project**, outside OneDrive (or with `node_modules` excluded), under git from the first commit. Rationale: (a) the résumé lists Next.js/React/TS/Tailwind, so the site doubles as proof of skill; (b) React Bits, Skiper UI and Vengeance UI are React/Tailwind/shadcn-style, so they cannot be used cleanly in a jQuery/Bootstrap page; (c) static export keeps hosting cheap and fast. Alternative considered: Astro (excellent performance) — rejected only because it moves away from the owner's own stack.

## 5. Design directions and recommendation

### Direction A — "Systems Noir" (recommended)
Near-black canvas, editorial grotesk type with mono metadata, one cool accent. The low-key portrait and the minimal RD mark are already on near-black, so they integrate without boxes or cut-outs. Differentiation comes from **content design** (an evidence ledger and a concurrency explainer, §6), not from colour.
### Direction B — "Paper Ledger"
Warm off-white, serif display, mono annotations, "engineering notebook" feel; diagrams look excellent on paper. Rejected as primary: the portrait and both RD logos are dark-native and would need frames/containers, and it carries less of the premium-tech register recruiters expect for backend roles.
### Risk of A (acknowledged)
Dark developer sites are common. Mitigation: invert to a light "case-study paper" panel for the Hostel Hunt architecture diagram, and let the evidence ledger carry the identity.

### Design system (proposal — values to be sampled from the final logo and contrast-checked in Phase 2)
- **Typography:** Geist (UI/body), Geist Mono (metadata, labels), Instrument Serif italic for one or two emphasised words per screen. All are open-licence Google Fonts via self-hosted `next/font` (confirm licences at install). Fluid scale, display ~clamp(3rem, 9vw, 8.5rem), body 17–18 px, line-height 1.55.
- **Palette (tokens):** `--bg #07070B`, `--surface #0E0E15`, `--line rgba(255,255,255,.09)`, `--text #EDEAF5`, `--muted #9794AB` (verify ≥ 4.5:1), `--accent` lavender sampled from RD mark (~#B7AEF2). **Hostel Hunt orange** exists only as a scoped token inside that case study. No gradients as decoration; no glass.
- **Grid/spacing:** 12-col, max width 1280, 8-pt scale, generous section padding (clamp 96–160 px). Asymmetric editorial layouts allowed; text measure ≤ 68ch.
- **Surfaces/borders/shadows:** flat surfaces separated by 1 px hairlines; shadows only for the single elevated card state; radius 12 px (cards), 999 px (chips).
- **Interaction:** visible focus rings (accent, 2 px offset); hover = subtle translate/underline, never colour-only; links ≥ 44 px targets.
- **Responsive:** mobile-first; portrait stacks above the name on phones; no horizontal scroll; explainer degrades to a static diagram under 640 px.
- **Motion rules:** one engine (GSAP) + Lenis; durations 300–800 ms, easing `power3.out`; animate transform/opacity only; no blocking preloader; no custom cursor; every animation wrapped in a `prefers-reduced-motion` gate (Lenis `respectReducedMotion` stays on); ambient background (if any) is CSS/canvas ≤ 20 KB and paused when off-screen or reduced-motion.
- **Budgets (targets to hold in Phase 2):** LCP < 2.5 s on throttled mobile; CLS < 0.1; initial-route JS ≲ 150 KB gzipped; Lighthouse accessibility ≥ 95; fully keyboard-operable.

## 10. Self-review as critical design lead

- **Weakest assumption:** that the Unifex template is the reference. If a different site was intended, §2 changes.
- **Thin portfolio risk:** one deep project plus analysis work. The plan answers this with depth and honesty, not padding; but without public links or screenshots the site will feel unproven. This is the real bottleneck, not tooling.
- **Differentiation:** a dark theme alone is generic. The identity must come from the evidence ledger and concurrency explainer; if those slip, the site slides toward template-ish.
- **Employer exposure:** NXERP is the most professionally valuable item and the most legally sensitive. Plan B: describe it only on the résumé page at résumé granularity.
- **Logo/asset quality:** both RD logos are raster and one is effect-heavy; a vector mark is a prerequisite for a crisp favicon/nav.
- **Evidence limits of this report:** resource details came from summarised page fetches; several licences were page-stated, not read in LICENSE files; the Lenis version is from page text; popularity counts (e.g. repository stars) were not used in decisions. The reference was not seen beyond its preloader.
- **Trade-off:** choosing Next.js over Astro trades a little performance headroom for skill alignment and React-component compatibility.
- **Restraint check:** I recommend two runtime dependencies for motion (GSAP, Lenis) and 1–3 vendored components. If the first design review feels "plain", the fix is better type, layout and content — not more libraries.

    var label = h.textContent.replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*/, ' ').replace(/ — .*$/, '').trim();
    [rail, mob].forEach(function (nav) {
      var a = document.createElement('a'); a.href = '#' + id; a.textContent = label;
      if (nav === mob) a.addEventListener('click', function () { document.getElementById('mtoc').open = false; });
      nav.appendChild(a);
    });
  });
  // scroll spy
  var links = rail.querySelectorAll('a');
  function spy() {
    var cur = 0;
    heads.forEach(function (h, i) { if (h.getBoundingClientRect().top < 140) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === cur); });
  }
  window.addEventListener('scroll', spy, { passive: true }); spy();
  // theme toggle (per-viewer convenience only)
  var btn = document.getElementById('themeBtn');
  btn.addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>

</html>
